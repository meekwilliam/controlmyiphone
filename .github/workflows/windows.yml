name: Windows build

# controlmyiphone.exe for windows, the tauri app in app/ on the rust engine in core/, the iphone driver comes from
# apple devices

on:
  push:
    branches: [main]
    paths: ["app/**", "core/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - name: Build controlmyiphone.exe
        run: cargo build --release

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Collect third-party licenses
        run: cargo about generate about.hbs -o target/release/THIRD_PARTY_LICENSES.txt

      - uses: actions/upload-artifact@v7
        with:
          name: controlmyiphone-windows
          path: |
            app/target/release/controlmyiphone.exe
            app/target/release/THIRD_PARTY_LICENSES.txt
