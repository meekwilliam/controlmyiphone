<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>controlmyiphone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar" data-tauri-drag-region>
  <div class="group">
    <button data-button="home" data-shortcut="1" title="Home">
      <svg viewBox="0 0 20 20"><rect x="3" y="3" width="5.5" height="5.5" rx="1.5"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.5"/><rect x="3" y="11.5" width="5.5" height="5.5" rx="1.5"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.5"/></svg>
    </button>
    <button data-button="app-switcher" data-shortcut="2" title="App Switcher">
      <svg viewBox="0 0 20 20"><rect x="6.5" y="2.5" width="11" height="11" rx="2.5"/><path d="M13.5 17.5h-8a3 3 0 0 1-3-3v-8"/></svg>
    </button>
    <button data-button="lock" title="Lock">
      <svg viewBox="0 0 20 20"><rect x="4" y="9" width="12" height="9" rx="2"/><path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9"/></svg>
    </button>
    <button data-button="volume-down" title="Volume Down">
      <svg viewBox="0 0 20 20"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z"/><path d="M13 10h5"/></svg>
    </button>
    <button data-button="volume-up" title="Volume Up">
      <svg viewBox="0 0 20 20"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z"/><path d="M13 10h5M15.5 7.5v5"/></svg>
    </button>
  </div>
  <div class="group">
    <button id="minimize" title="Minimize">
      <svg viewBox="0 0 20 20"><path d="M5 10h10"/></svg>
    </button>
    <button id="close" title="Close">
      <svg viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
    </button>
  </div>
</header>

<nav id="tabs"></nav>

<main id="stage" data-tauri-drag-region>
  <section id="empty" data-tauri-drag-region>
    <div class="phone-glyph"></div>
    <h2 id="empty-title">Plug in an iPhone</h2>
    <p id="empty-text">Connect it with a cable, unlock it, and tap Trust if it asks.</p>
    <button id="retry" hidden>Try again</button>
  </section>
  <canvas id="video" hidden></canvas>
  <div id="status"></div>
</main>

<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
