[package]
name = "controlmyiphone-app"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "controlmyiphone's window: an iPhone's screen, live, on the same Rust engine for Windows and Mac"
repository = "https://github.com/meekwilliam/controlmyiphone"

[[bin]]
name = "controlmyiphone"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
controlmyiphone-core = { path = "../core" }
# custom-protocol serves web/ from inside the exe instead of a dev server
tauri = { version = "=2.12.4", features = ["custom-protocol"] }
tokio = { version = "1.54", features = ["rt", "time", "sync"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
