[package]
name = "mirrormyiphone-core"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "mirrormyiphone's engine: streams an iPhone's screen live and passes clicks back to it as touches"
repository = "https://github.com/meekwilliam/mirrormyiphone"

[lib]
name = "mirrormyiphone_core"

[[bin]]
name = "mirrormyiphone-cli"
path = "src/main.rs"

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = [
    "ring",
    "usbmuxd",
    "core_device",
    "core_device_proxy",
    "tunnel_tcp_stack",
    "rsd",
    "xpc",
    "display_stream",
    "mobile_image_mounter",
    "tss",
] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
plist = "1.10"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
